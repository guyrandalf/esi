appId: com.guyrandalf.esi
productName: Esi
directories:
  buildResources: build
  output: dist.noindex
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: esi-scaffold
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  extendInfo:
    NSCameraUsageDescription: Esi uses the camera for vision-based commands.
    NSMicrophoneUsageDescription: Esi listens for the wake word and voice commands.
    NSCalendarsUsageDescription: Esi reads your Calendar to show today's agenda and upcoming events.
    NSContactsUsageDescription: Esi reads Contacts to identify people you mention.
    NSAppleEventsUsageDescription: Esi controls Calendar, Mail, and other apps on your behalf when you ask it to.
    NSDocumentsFolderUsageDescription: Esi reads files when you reference them by path.
    NSDownloadsFolderUsageDescription: Esi reads files in Downloads when you reference them.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
